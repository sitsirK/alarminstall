# The phone's Power button is the installer's "Enter". logind's default
# (HandlePowerKey=poweroff) would switch the phone off on the first press.
# Suspend is a hard reset on this SoC (s2idle), so every sleep key is ignored too.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
IdleAction=ignore
