# Live installer only: hand the PC on the other end of the USB cable an address
# (172.16.42.100-119), so `ssh root@172.16.42.1` works without setting one by
# hand. No router and no DNS are offered: the PC's own internet stays as it is.
# r8q-arch's host-tether.sh still adds 172.16.42.14, the phone's gateway.
[Network]
DHCPServer=yes

[DHCPServer]
PoolOffset=100
PoolSize=20
EmitRouter=no
EmitDNS=no
