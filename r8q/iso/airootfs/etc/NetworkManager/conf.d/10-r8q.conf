# Same as the installed system: usb0 is the SSH link and belongs to
# systemd-networkd; DNS comes from the static /etc/resolv.conf.
[main]
dns=none

[keyfile]
unmanaged-devices=interface-name:usb0

[device]
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=permanent
# Live installer: no Wi-Fi power save. With it the phone sleeps through ARP and
# an SSH attempt over Wi-Fi fails with "No route to host" until it wakes up.
wifi.powersave=2
