# Built into BOOTAA64.EFI (the image's FAT partition). Find the image's ISO9660
# volume, or failing that the FAT partition itself, and run its grub.cfg.
search --no-floppy --set=root --label ALARMINSTALL
if [ -z "$root" ]; then
    search --no-floppy --set=root --file /boot/Image
fi
set prefix=($root)/boot/grub
configfile ($root)/boot/grub/grub.cfg
