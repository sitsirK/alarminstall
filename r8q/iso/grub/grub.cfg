# alarminstall — boot menu. Vol-Up / Vol-Down move, Power selects (the firmware
# maps the keys); with no key the first entry starts after 5 s.
# Also run as-is by Ventoy, which loop-mounts the .iso as $root.
set default=0
set timeout=5

# The kernel's own command line, minus dtb=: GRUB supplies the device tree.
set r8qargs="earlycon=efifb keep_bootcon console=tty0 loglevel=3 clk_ignore_unused pd_ignore_unused arm-smmu.disable_bypass=0 panic=30 irqchip.gicv3_pseudo_nmi=1 audit=0"

# Under QEMU (how the image is tested on a PC) use QEMU's own device tree and add
# a serial console. Ventoy's GRUB may lack smbios: then this is simply skipped.
if smbios --type 1 --get-string 4 --set sysvendor; then
    if [ "$sysvendor" = "QEMU" ]; then
        set default=1
        set timeout=1
        set r8qargs="$r8qargs console=ttyAMA0"
    fi
fi

menuentry "alarminstall — install Arch Linux ARM (Galaxy S20 FE 5G, r8q)" {
    echo "Loading the r8q device tree ..."
    devicetree /boot/r8q.dtb
    echo "Loading the kernel ..."
    linux /boot/Image $r8qargs
}

menuentry "alarminstall — use the firmware's device tree" {
    linux /boot/Image $r8qargs
}

menuentry "Power off" {
    halt
}
